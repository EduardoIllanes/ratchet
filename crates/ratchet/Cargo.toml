[package]
name = "ratchet"
version = "0.2.0"
edition = "2021"
rust-version = "1.79"
description = "Guardrailed, spec-driven harness for Claude Code"
license = "MIT"

[[bin]]
name = "ratchet"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fancy-regex = "0.13"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
